server:
  port: 8088

spring:
  application:
    name: luoyi-example-mybatis
  datasource:
    druid: # Druid 【监控】相关的全局配置
      initial-size: 5
      min-idle: 1
      max-active: 10
      max-wait: 60000
    url: jdbc:mysql://127.0.0.1:3306/luoyi-example-mybatis?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true # MySQL Connector/J 8.X 连接的示例
    username: root
    password: Lichee@323
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource


mybatis-plus:
  type-aliases-package: com.luoyi.example.mybatis.model.entity
#  type-enums-package: com.scshangtong.order.enums
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler

